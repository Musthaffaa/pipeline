<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Theme Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Hello, World!</h2>
        <p>Click a color button below to switch themes:</p>
        
        <!-- Color Theme Buttons -->
        <div class="theme-buttons">
            <button class="theme-btn" data-theme="default" style="background-color: #f4f4f9;" title="Default Light"></button>
            <button class="theme-btn" data-theme="dark-mode" style="background-color:  #1a1a1a;" title="Dark Mode"></button>
            <button class="theme-btn" data-theme="blue-mode" style="background-color: #38bdf8;" title="Ocean Blue"></button>
            <button class="theme-btn" data-theme="emerald-mode" style="background-color: #34d399;" title="Emerald Green"></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
